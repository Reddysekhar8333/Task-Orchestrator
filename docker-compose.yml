x-app-env: &app-env
  ENV: PROD
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:-default-insecure-key}
  # Default to sqlite unless Azure SQL is explicitly enabled.
  USE_AZURE_SQL: ${USE_AZURE_SQL:-False}
  DB_NAME: ${DB_NAME:-}
  DB_USER: ${DB_USER:-}
  DB_PASS: ${DB_PASS:-}
  DB_HOST: ${DB_HOST:-}
  DB_PORT: ${DB_PORT:-1433}
  SQL_SERVER_DRIVER: ${SQL_SERVER_DRIVER:-ODBC Driver 18 for SQL Server}
  AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
  AZURE_ACCOUNT_NAME: ${AZURE_ACCOUNT_NAME:-}
  AZURE_ACCOUNT_KEY: ${AZURE_ACCOUNT_KEY:-}
  AZURE_MEDIA_CONTAINER: ${AZURE_MEDIA_CONTAINER:-media}
  AZURE_STATIC_CONTAINER: ${AZURE_STATIC_CONTAINER:-static}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  # 1. Redis (message broker)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  # 2. Django (web)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python task_manager/manage.py migrate --fake-initial &&
      gunicorn --chdir /app/task_manager/task_manager --bind 0.0.0.0:8000 task_manager.wsgi:application"
    environment:
      <<: *app-env
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,4.186.40.170}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    depends_on:
      redis:
        condition: service_healthy
  # 3. Celery (background worker) 
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery --workdir /app/task_manager/task_manager -A task_manager worker --loglevel=info
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
  # 4. Nginx (reverse proxy)
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
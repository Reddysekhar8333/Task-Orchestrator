server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    # Docker DNS server for service discovery. Using a variable in proxy_pass
    # makes nginx re-resolve the upstream periodically, which prevents stale
    # container IPs from causing intermittent 502 responses.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;

        # Preserve the incoming host header (including explicit port when used).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}